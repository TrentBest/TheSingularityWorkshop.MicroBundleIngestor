name: Build

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.MicroBundleIngestor.sln

      - name: Build
        run: dotnet build TheSingularityWorkshop.MicroBundleIngestor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TheSingularityWorkshop.MicroBundleIngestor.sln --configuration Release --no-build
